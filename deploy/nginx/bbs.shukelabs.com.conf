map $http_x_forwarded_proto $ember_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name bbs.shukelabs.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bbs.shukelabs.com;

    ssl_certificate /etc/letsencrypt/live/bbs.shukelabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbs.shukelabs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bbs.shukelabs.com.access.log;
    error_log  /var/log/nginx/bbs.shukelabs.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ember_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
