services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
